services:
  zookeeper:
    image: zookeeper:3.9.3
    container_name: zookeeper
    restart: always

  nimbus:
    image: storm:latest
    container_name: nimbus
    hostname: nimbus
    command: storm nimbus
    depends_on:
      - zookeeper
    restart: always

  supervisor:
    image: storm:latest
    container_name: supervisor
    command: storm supervisor -c worker.childopts=-Xmx2g
    depends_on:
      - nimbus
      - zookeeper
    restart: always

  ui:
    image: storm:latest
    container_name: ui
    command: storm ui
    depends_on:
      - nimbus
    restart: always
    ports:
      - "8080:8080"

  urlfrontier:
    image: crawlercommons/url-frontier:latest
    container_name: urlfrontier
    restart: always
    ports:
      - "7071:7071"

  mongo:
    image: mongo:latest
    container_name: mongoDb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db

  # NOTE: no browser service here on purpose.
  # The Playwright protocol runs an EMBEDDED headless Chromium inside the Storm
  # worker (see crawler-conf.yaml). For `storm local` the browser lives in the
  # host's Playwright cache (installed by restart-crawler.sh); for K8s it is
  # baked into the worker image. A session-pooling proxy like browserless is
  # NOT compatible with StormCrawler's long-lived browser connection.

volumes:
  mongo_data: