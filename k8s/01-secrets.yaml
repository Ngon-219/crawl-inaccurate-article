# MongoDB credentials.
#
# In production DO NOT commit real secrets. Generate them at deploy time, e.g.
#   kubectl -n crawler create secret generic mongo-credentials \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=admin \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD="$(openssl rand -base64 24)"
# or sync from a real secret store (External Secrets Operator / Vault / SealedSecrets).
#
# The plaintext values below exist only so `kubectl apply -k .` works out of the
# box for a demo. `stringData` lets you write values in clear text; Kubernetes
# base64-encodes them for you.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: crawler
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "password123"
  # Full connection string handed to the crawler worker. Host = the MongoDB
  # headless Service DNS name (see 21-mongodb.yaml). authSource=admin because
  # the root user lives in the admin database.
  MONGO_URI: "mongodb://admin:password123@mongodb-0.mongodb.crawler.svc.cluster.local:27017/?authSource=admin"
