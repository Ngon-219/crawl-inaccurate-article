# One-shot Job: submit the Flux topology to Nimbus.
#
# WHY a Job: submission is a run-once action. `storm jar ... Flux crawler.flux`
# uploads the JAR + merged config to Nimbus and returns; the topology then runs
# on the supervisors indefinitely. The submitter itself does NOT stay running —
# so it is a Job, not a Deployment.
#
# Re-running: submitting a topology whose name already exists fails. To redeploy
# code/config, first kill it:  storm kill crawler  (then let it drain, resubmit).
# The README documents a helper for this.
apiVersion: batch/v1
kind: Job
metadata:
  name: submit-topology
  namespace: crawler
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: submit-topology
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-nimbus
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for nimbus thrift :6627 ..."
              until nc -z nimbus 6627; do sleep 3; done
              echo "nimbus is up"
      containers:
        - name: submit
          image: inaccurate-article-crawler:1.0
          imagePullPolicy: IfNotPresent
          workingDir: /crawler        # crawler.flux includes crawler-conf.yaml by RELATIVE path
          command:
            - sh
            - -c
            - |
              set -e
              # Use the K8s crawler-conf.yaml (mounted from ConfigMap) instead of
              # any baked copy, so the topology gets cluster hostnames.
              cp /config/crawler-conf.yaml /crawler/crawler-conf.yaml
              echo "submitting flux topology 'crawler' to nimbus..."
              storm jar /crawler/app.jar \
                org.apache.storm.flux.Flux /crawler/crawler.flux
          volumeMounts:
            - name: storm-config
              mountPath: /conf/storm.yaml   # nimbus.seeds so `storm jar` finds the master
              subPath: storm.yaml
            - name: crawler-config
              mountPath: /config
      volumes:
        - name: storm-config
          configMap:
            name: storm-config
        - name: crawler-config
          configMap:
            name: crawler-config
