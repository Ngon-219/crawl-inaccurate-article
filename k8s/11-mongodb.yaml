# MongoDB — the document sink written by MongoIndexerBolt (crawler_db.articles).
#
# WHY StatefulSet: it is a database. The crawled corpus must survive pod
# restarts/rescheduling (stable PVC), and MongoIndexerBolt addresses a stable
# hostname. A Deployment would risk a new pod attaching to a fresh empty volume
# and could allow two pods to fight over one RWO volume during a rollout.
#
# This is a single-node MongoDB — fine for a crawler sink. For real HA use the
# MongoDB Community/Enterprise Operator to run a replica set.
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: crawler
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: crawler
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef: { name: mongo-credentials, key: MONGO_INITDB_ROOT_USERNAME }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mongo-credentials, key: MONGO_INITDB_ROOT_PASSWORD }
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "2Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
